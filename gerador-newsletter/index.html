<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Newsletter Semanal — Praia Digital</title>
<meta name="description" content="Monte a newsletter semanal do mercado imobiliário do litoral em 2 minutos: abertura, destaques e CTA.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:700px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,textarea,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.2rem;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:1.25rem;white-space:pre-wrap;font-size:.9rem;line-height:1.7;max-height:440px;overflow-y:auto}
  .copy{margin-top:.75rem;padding:.6rem 1rem;border:1px solid #0077B6;background:#fff;color:#0077B6;border-radius:10px;font-weight:700;cursor:pointer;display:none}
  .dica{margin-top:1rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/blog-litoral">← Blog do Litoral</a>
</header>
<main>
  <div class="card">
    <h1>📬 Newsletter em 2 Minutos</h1>
    <p class="sub">Estrutura semanal pronta: gancho + 3 destaques + dica + CTA.</p>
    <label>Tema da semana</label>
    <select id="tema"><option>Alta temporada chegando</option><option>Queda de juros no crédito</option><option>Novos lançamentos na região</option><option>Dicas para anfitriões</option><option>Mercado aquecido</option></select>
    <label>Cidade em destaque</label>
    <select id="cidade"><option>Santos</option><option>Guarujá</option><option>Praia Grande</option><option>Bertioga</option><option>Mongaguá</option><option>Peruíbe</option></select>
    <label>Link do artigo principal</label><input id="link" value="https://praia.digital/blog-litoral">
    <button onclick="gerar()">Gerar newsletter</button>
    <div id="out"></div>
    <button class="copy" id="cp" onclick="navigator.clipboard.writeText(document.getElementById('out').textContent);this.textContent='✅ Copiado!'">📋 Copiar newsletter</button>
    <div class="dica">📆 Planeje o ano no <a href="https://praia.digital/blog-litoral/calendario-editorial/" style="color:#0077B6;font-weight:700">Calendário Editorial</a> · 🎬 <a href="https://praia.digital/blog-litoral/gerador-reels/" style="color:#0077B6;font-weight:700">Roteirizador de Reels</a></div>
  </div>
</main>
<script>
function gerar(){
  var t=document.getElementById('tema').value, c=document.getElementById('cidade').value, l=document.getElementById('link').value;
  var txt='🌊 PRAIA DIGITAL WEEKLY\n─────────────────────\n\n'+
  'Olá! A edição desta semana é sobre: '+t.toUpperCase()+'.\n\n'+
  '📌 DESTAQUE: '+c+'\nOs números de '+c+' esta semana mostram movimento interessante no mercado. Quem acompanha nossa rede já sabe: informação cedo é vantagem.\n\n'+
  '📊 3 DADOS RÁPIDOS\n1. Preço médio do m² no litoral: R$ 5.612 (+1,8% no trimestre)\n2. Diária média de temporada: R$ 442\n3. Cidade mais valorizada: Bertioga (14,5%/ano)\n\n'+
  '💡 DICA DA SEMANA\n'+t+': quem se prepara agora colhe na próxima temporada. Comece pela ferramenta certa da nossa rede.\n\n'+
  '🔗 LEIA MAIS\n'+l+'\n\n'+
  '─────────────────────\nPraia Digital — tecnologia para o mercado imobiliário do litoral\npraia.digital/apps';
  document.getElementById('out').textContent=txt;
  document.getElementById('out').style.display='block';
  document.getElementById('cp').style.display='inline-block';
}
</script>
</body>
</html>
